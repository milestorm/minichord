<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <link rel="icon" sizes="192x192" type="image/png" href="../img/android-chrome-192x192.png" />
  <link rel="icon" sizes="512x512" type="image/png" href="../img/android-chrome-512x512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../img/apple-touch-icon.png" />
  <link rel="shortcut icon" sizes="48x48" type="image/png" href="../img/favicon.ico" />
  <link rel="icon" sizes="16x16" type="image/png" href="../img/favicon-16x16.png" />
  <link rel="icon" sizes="32x32" type="image/png" href="../img/favicon-32x32.png" />
  <link rel="stylesheet" href="css/vst.css" />
  <title>minicontrol</title>
</head>
<body class="disconnected">
  <header class="vst-header">
    <h1>mini<span>control</span></h1>
    <div id="status_zone" class="vst-status">
      <span class="dot"></span>
      <span id="status_value">disconnected</span>
    </div>

    <div class="vst-toolbar-group">
      <span class="label">bank</span>
      <select id="bank_number_selection" class="vst-select" title="Target bank">
        <option value="0">1</option><option value="1">2</option><option value="2">3</option>
        <option value="3">4</option><option value="4">5</option><option value="5">6</option>
        <option value="6">7</option><option value="7">8</option><option value="8">9</option>
        <option value="9">10</option><option value="10">11</option><option value="11">12</option>
      </select>
      <button class="vst-btn primary" onclick="save_current_settings()">save</button>
      <button class="vst-btn" onclick="reset_current_bank()" title="Reset current bank">reset</button>
    </div>

    <div class="vst-toolbar-group">
      <span class="label">share</span>
      <button class="vst-btn" onclick="generate_settings()">export</button>
      <button class="vst-btn" onclick="load_settings()">import</button>
    </div>

    <div class="vst-toolbar-group">
      <button class="vst-btn" id="randomise_btn" title="Randomise all values">🎲 random</button>
      <button class="vst-btn" onclick="reset_memory()" title="Reset all banks">erase all</button>
    </div>

    <div class="vst-spacer"></div>

    <a class="vst-btn always-on" href="./minishop.html" title="Browse user-submitted presets">minishop</a>
    <button class="vst-btn icon always-on" id="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode" aria-label="Toggle dark mode">◐</button>
  </header>

  <ul class="vst-conn-steps" id="conn_steps">
    <li id="step1" class="unsatisfied">grant the system MIDI authorisation</li>
    <li id="step2" class="unsatisfied">use a recent version of Chrome / Edge</li>
    <li id="step3" class="unsatisfied">connect the minichord by USB and turn it on</li>
  </ul>
  <div id="information_zone" tabindex="-1"><span id="information_text">&gt; Please follow the steps above to connect.</span></div>

  <main id="vst-root"></main>

  <script src="javascript/minichordcontroller.js"></script>
  <script src="javascript/ui/widgets.js"></script>
  <script src="javascript/ui/visualizers.js"></script>
  <script src="javascript/ui/layout.js"></script>
  <script src="javascript/index.js"></script>
</body>
</html>
